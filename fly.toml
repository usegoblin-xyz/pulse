# Pulse brain on Fly. Single machine — sessions and the rate-limiter are
# in-process, so do NOT scale horizontally. Deploy with: fly deploy --ha=false
app = "pulse-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Pulse's vision (screen) and PRD writing both run through OpenRouter's
  # OpenAI-compatible endpoint on a FREE open-source model (NVIDIA Nemotron Nano
  # 12B VL — vision + text, no per-call cost). Replaced Gemini (kept hitting its
  # free-tier quota). Key is secret PULSE_VISION_API_KEY (an OpenRouter key).
  PULSE_VISION_BASE_URL = "https://openrouter.ai/api/v1"
  PULSE_VISION_MODEL = "nvidia/nemotron-nano-12b-v2-vl:free"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-warm: a demo link people click cold should start instantly, and it
  # avoids the boot race on the first /session-token call.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # Chromium needs headroom — 512mb is not enough for the browser agent.
  size = "shared-cpu-2x"
  memory = "2048mb"
