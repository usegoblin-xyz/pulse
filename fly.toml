# Pulse brain on Fly. Single machine — sessions and the rate-limiter are
# in-process, so do NOT scale horizontally. Deploy with: fly deploy --ha=false
app = "pulse-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Pulse's vision runs through Hugging Face's OpenAI-compatible router.
  # Swap PULSE_VISION_MODEL to any served VLM (e.g. Qwen/Qwen2.5-VL-32B-Instruct).
  # The HF token itself is set as the secret PULSE_VISION_API_KEY.
  PULSE_VISION_BASE_URL = "https://router.huggingface.co/v1"
  PULSE_VISION_MODEL = "zai-org/GLM-4.5V"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-warm: a demo link people click cold should start instantly, and it
  # avoids the boot race on the first /session-token call.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
