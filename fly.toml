# Pulse brain on Fly. Single machine — sessions and the rate-limiter are
# in-process, so do NOT scale horizontally. Deploy with: fly deploy --ha=false
app = "pulse-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Pulse's EYES: the self-hosted SmolVLM2 VLM (app pulse-vlm), reached over Fly's
  # private 6PN network — never exposed publicly. No API fees, no rate limits.
  # Auth is the secret PULSE_VLM_API_KEY (defense-in-depth on top of the private net).
  PULSE_VLM_BASE_URL = "http://pulse-vlm.internal:8080/v1"
  PULSE_VLM_MODEL = "smolvlm"
  # Pulse's WRITING (PRDs) still uses a hosted text model via the OpenAI-compatible
  # endpoint below; the VLM can't write documents. Key is secret PULSE_VISION_API_KEY.
  PULSE_VISION_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
  PULSE_VISION_MODEL = "gemini-flash-latest"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-warm: a demo link people click cold should start instantly, and it
  # avoids the boot race on the first /session-token call.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # Chromium needs headroom — 512mb is not enough for the browser agent.
  size = "shared-cpu-2x"
  memory = "2048mb"
